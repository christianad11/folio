<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'">
  <meta name="description" content="A little space to read. A quiet PDF library with shelves, saved passages, and nothing in the way.">
  <title>Folio</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/Michelangelus-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="startup-screen" class="startup-screen" role="status" aria-label="Opening Folio"><div class="startup-mark"><svg aria-hidden="true"><use href="#i-book"/></svg><span>folio<span class="brand-dot">.</span></span></div><div class="startup-line" aria-hidden="true"><span></span></div></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5.5C9.5 3.8 6.7 3.5 3 4.5v15c3.7-1 6.5-.7 9 1 2.5-1.7 5.3-2 9-1v-15c-3.7-1-6.5-.7-9 1Z"/><path d="M12 5.5v15"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="16" rx="1"/><rect x="14" y="4" width="6" height="16" rx="1"/></symbol>
    <symbol id="i-read" viewBox="0 0 24 24"><path d="M4 4v16h16M8 16l4-4 3 2 5-7"/><path d="M16 7h4v4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m9 15 6-6M8 16l-1 1a4.2 4.2 0 0 1-6-6l5-5a4.2 4.2 0 0 1 6 0m0 12a4.2 4.2 0 0 0 6 0l5-5a4.2 4.2 0 0 0-6-6l-1 1" transform="translate(1 0) scale(.92)"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-shelf" viewBox="0 0 24 24"><path d="M4 20h16M5 16V4h4v12zm7 0V6h3v10zm6 0-1-11 3-.3 1 11"/></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-chapters" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.1M4 12h.1M4 18h.1"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-highlight" viewBox="0 0 24 24"><path d="m14 3 7 7-9 9-7-7Zm-9 9-2 7 7-2M3 22h15"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A9 9 0 0 1 8.5 4 9 9 0 1 0 20 15.5Z"/></symbol>
  </defs></svg>

  <div id="library-view" class="library-layout">
    <aside class="library-sidebar" id="library-sidebar" aria-label="Library navigation">
      <a class="brand" href="#library" aria-label="Folio library"><svg class="brand-icon"><use href="#i-book"/></svg><span>folio<span class="brand-dot">.</span></span></a>
      <nav id="shelf-nav" aria-label="Shelves"></nav>
      <div class="shelf-label"><span>Shelves</span><button class="icon-button small" id="new-shelf-icon" aria-label="Create shelf"><svg><use href="#i-plus"/></svg></button></div>
      <nav id="custom-shelf-nav" aria-label="Custom shelves"></nav>
      <button id="new-shelf" class="new-shelf"><svg><use href="#i-plus"/></svg>Create a shelf</button>
      <div class="sidebar-bottom"><button id="help-button" class="quiet-button" aria-label="Show keyboard shortcuts"><span class="shortcut-icon" aria-hidden="true">?</span>Keyboard shortcuts</button><button id="export-library" class="quiet-button"><svg><use href="#i-download"/></svg>Export saved passages</button></div>
    </aside>
    <div class="library-content">
      <header class="library-topbar"><button id="mobile-menu" class="icon-button mobile-only" aria-label="Toggle library navigation" aria-expanded="false"><svg><use href="#i-menu"/></svg></button></header>
      <main id="main" class="library-main" tabindex="-1">
        <div class="library-heading"><div><h1 id="library-title">Your library</h1></div><div class="add-actions"><button id="add-pdfs" class="primary-button"><svg><use href="#i-plus"/></svg>Add PDFs</button><button id="add-options-toggle" class="primary-button split-button" aria-label="More ways to add PDFs" aria-expanded="false"><svg><use href="#i-down"/></svg></button><div id="add-menu" class="floating-menu" hidden><button id="link-file"><svg><use href="#i-link"/></svg>Link a local PDF<small>Keep the original file on your computer</small></button><button id="backup-library"><svg><use href="#i-download"/></svg>Back up library</button></div></div></div>
        <div id="reading-spot" class="reading-spot" hidden></div>
        <div class="library-tools"><div class="book-count" id="book-count">1 book</div><div class="library-tool-right"><label class="search-field"><svg><use href="#i-search"/></svg><span class="sr-only">Find a book</span><input id="book-search" type="search" placeholder="Find a book" autocomplete="off"></label><label class="sort-field"><span class="sr-only">Sort books</span><select id="book-sort"><option value="manual">Shelf order</option><option value="recent">Recently opened</option><option value="title">Title, A–Z</option><option value="progress">Reading progress</option></select><svg><use href="#i-down"/></svg></label></div></div>
        <div id="books-grid" class="books-grid"></div>
      </main>
    </div>
  </div>

  <div id="reader-view" class="reader-layout" hidden>
    <header class="reader-header">
      <div class="reader-leading"><button id="back-library" class="back-button"><svg><use href="#i-left"/></svg><span>Library</span></button><div class="header-rule"></div><a class="reader-brand" href="#library" aria-label="Return to Folio library">folio<span>.</span></a></div>
      <div class="reader-title-block"><h1 id="reader-title">The art of paying attention</h1><span id="reader-author">Folio field notes</span></div>
      <div class="reader-actions"><button id="search-toggle" class="icon-button" aria-label="Search PDF" aria-expanded="false" aria-controls="pdf-search" data-tip="Find in PDF · ⌘/Ctrl F"><svg><use href="#i-search"/></svg></button><button id="chapters-toggle" class="icon-button" aria-label="Show chapters" aria-expanded="false" aria-controls="chapters-panel" data-tip="Chapters · C"><svg><use href="#i-chapters"/></svg></button><button id="saved-toggle" class="icon-button" aria-label="Show saved passages" aria-expanded="false" aria-controls="saved-panel" data-tip="Saved passages · S"><svg><use href="#i-bookmark"/></svg><span id="saved-badge" class="count-badge" hidden>0</span></button><span class="header-rule"></span><button id="theme-toggle" class="icon-button" aria-label="Use dark reading background" data-tip="Reading background"><svg><use href="#i-moon"/></svg></button><button id="focus-toggle" class="icon-button" aria-label="Enter focus mode" aria-pressed="false" data-tip="Focus mode · F"><svg><use href="#i-focus"/></svg></button></div>
    </header>
    <form id="pdf-search" class="reader-search" role="search" aria-label="Search this PDF" hidden>
      <label class="pdf-search-field" for="pdf-query"><svg aria-hidden="true"><use href="#i-search"/></svg><span class="sr-only">Find in PDF</span><input id="pdf-query" type="search" placeholder="Find in PDF" autocomplete="off" spellcheck="false" enterkeyhint="search"></label>
      <span id="search-count" class="search-count" aria-hidden="true"></span><span id="search-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
      <button id="search-previous" type="button" class="icon-button" aria-label="Previous search result" title="Previous result · Shift Enter" disabled><svg class="search-up"><use href="#i-down"/></svg></button>
      <button id="search-next" type="button" class="icon-button" aria-label="Next search result" title="Next result · Enter" disabled><svg><use href="#i-down"/></svg></button>
      <button id="search-close" type="button" class="icon-button" aria-label="Close PDF search" title="Close search · Esc"><svg><use href="#i-close"/></svg></button>
    </form>
    <div class="reader-workspace">
      <aside id="chapters-panel" class="reader-panel chapter-panel" hidden aria-label="Chapters"><div class="panel-heading"><div><h2>Contents</h2></div><button id="close-chapters" class="icon-button" aria-label="Close chapters"><svg><use href="#i-close"/></svg></button></div><nav id="chapters-list" aria-label="Document chapters"></nav></aside>
      <main id="reader-main" class="reader-main" tabindex="-1" aria-label="PDF document"><div id="pages-container" class="pages-container"></div><div id="page-loading" class="reader-opening"><span class="spinner" aria-hidden="true"></span><span>Opening PDF…</span></div></main>
      <aside id="saved-panel" class="reader-panel saved-panel" hidden aria-label="Saved passages"><div class="panel-heading"><div><h2>Saved passages</h2></div><button id="close-saved" class="icon-button" aria-label="Close saved passages"><svg><use href="#i-close"/></svg></button></div><div id="saved-list" class="saved-list"></div><div class="export-footer"><label for="export-format">Export as</label><div><select id="export-format"><option value="md">Markdown</option><option value="txt">Plain text</option><option value="json">JSON</option></select><button id="export-book" class="primary-button"><svg><use href="#i-download"/></svg>Export</button></div></div></aside>
    </div>
    <footer class="reader-footer"><div class="reading-controls" role="group" aria-label="Reading controls"><button id="bookmark-page" class="icon-button" aria-label="Bookmark this page" aria-pressed="false" data-tip="Bookmark page · B"><svg><use href="#i-bookmark"/></svg></button><div id="page-counter" class="page-counter" role="group" aria-label="Page navigation"><input id="current-page" type="text" inputmode="numeric" value="1" aria-label="Page number" title="Type a page number and press Enter" autocomplete="off" spellcheck="false"><span aria-hidden="true">/</span><span id="total-pages">6</span></div><span class="controls-rule"></span><button id="zoom-out" class="icon-button" aria-label="Zoom out"><svg><use href="#i-minus"/></svg></button><div class="zoom-select"><label for="zoom-select" class="sr-only">Zoom level</label><select id="zoom-select"><option value="fit-page">Fit page</option><option value="fit-width">Fit width</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="2.5">250%</option><option value="3">300%</option></select><svg><use href="#i-down"/></svg></div><button id="zoom-in" class="icon-button" aria-label="Zoom in"><svg><use href="#i-plus"/></svg></button></div></footer>
    <button id="exit-focus" class="exit-focus" hidden><svg><use href="#i-focus"/></svg>Exit focus<span>Esc</span></button>
    <div id="reading-progress-line" class="reading-progress-line" aria-hidden="true"></div>
  </div>

  <div id="selection-toolbar" class="selection-toolbar" hidden role="toolbar" aria-label="Save selected passage"><button id="save-selection"><svg><use href="#i-highlight"/></svg>Save passage</button><span></span><button class="color-choice selected" data-color="yellow" aria-label="Use yellow highlight" aria-pressed="true"></button><button class="color-choice" data-color="sage" aria-label="Use sage highlight" aria-pressed="false"></button><button class="color-choice" data-color="rose" aria-label="Use rose highlight" aria-pressed="false"></button></div>
  <div id="drop-overlay" class="drop-overlay" hidden><div><svg><use href="#i-book"/></svg><h2>Drop PDFs to add them</h2></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button id="toast-close" class="icon-button small" aria-label="Dismiss message"><svg><use href="#i-close"/></svg></button></div>
  <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>
  <dialog id="app-dialog"><form method="dialog" id="dialog-form"><div class="dialog-top"><div id="dialog-icon" class="dialog-icon"><svg><use href="#i-shelf"/></svg></div><button type="button" id="dialog-close" class="icon-button" aria-label="Close dialog"><svg><use href="#i-close"/></svg></button></div><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions" class="dialog-actions"><button type="button" id="dialog-cancel" class="secondary-button">Cancel</button><button type="submit" id="dialog-submit" class="primary-button">Create shelf</button></div></form></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
